 <main>
 <div class="shop-top">
 <div>
 <label style="margin-right: 0.5rem; color: #94a3b8;">Ֆիլտրեր:</label>
 <select id="bajnivtrats" class="cat-select">
 <option value="all">Բոլոր բաժինները</option>
 <option value="electronics">Electronics</option>
 <option value="sweets">Քաղցրավենիք Sweets</option>
 </select>
 </div>
 </div>

 <div id="xanut-apranqner" class="products-grid"></div>
 </main>

 <div id="lracucich-patuhan" class="modal hidden"></div>
 <div id="tsanucum" class="toast"></div>

 <script src="data.js"></script>
 <script src="api.js"></script>
 <script src="store.js"></script>
 <script src="app.js"></script>
 <script>
 let bolorapranqner = [];

 
 async function skselxanut() {
 try {
 bolorapranqner = await apranqneristatsum();
 
 const hxumiparametrer = new URLSearchParams(window.location.search);
 const bajinparametr = hxumiparametrer.get('category');
 if(bajinparametr) {
 document.getElementById("bajnivtrats").value = bajinparametr;
 }

 
 filterapranqner();
 } catch(sxal) { 
 console.error(sxal); 
 }
 }

 
 function filterapranqner() {
 const intrvadbajin = document.getElementById("bajnivtrats").value;

 let ztvats = bolorapranqner.filter(apranq => {
 return (intrvadbajin === "all") || (apranq.category === intrvadbajin);
 });

 nkartsncel(ztvats, "xanut-apranqner");
 }

 document.getElementById("bajnivtrats").addEventListener("change", filterapranqner);

 skselxanut();
 </script>
</body>
